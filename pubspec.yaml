name: checklist_app
description: A local-first checklist and notes app for Android.
publish_to: 'none'
version: 0.5.5+50

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  camera: ^0.11.1
  crypto: ^3.0.8
  file_picker: ^13.3.2
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  image: ^4.12.0
  path_provider: ^2.1.5
  sensors_plus: ^7.1.1
  shared_preferences: ^2.3.5
  url_launcher: ^6.3.2

dev_dependencies:
  camera_platform_interface: ^2.15.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - Checklist_app_icon_safe.png
    - assets/fonts/PixelifySans-OFL.txt
    - assets/fonts/Rajdhani-OFL.txt
  fonts:
    - family: Pixelify Sans
      fonts:
        - asset: assets/fonts/PixelifySans.ttf
    - family: Rajdhani
      fonts:
        - asset: assets/fonts/Rajdhani-Medium.ttf
          weight: 500
        - asset: assets/fonts/Rajdhani-Bold.ttf
          weight: 700

name: checklist_app
description: A minimal cross-platform project checklist for Linux and Android.
publish_to: 'none'
version: 0.4.8+33

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  camera: ^0.11.1
  file_picker: ^13.3.2
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  image: ^4.12.0
  path_provider: ^2.1.5
  sensors_plus: ^7.1.1
  shared_preferences: ^2.3.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - Checklist_app_logo.png
